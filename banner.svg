<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Kayke — aprendendo dados</title>
  <desc id="d">Kayke, autodidata em Python, aprendendo Análise de Dados, um exercício de cada vez.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#1d1d1a"/>
    </pattern>
    <radialGradient id="glow" cx="0.85" cy="0.9" r="0.65">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2f2ee"/>
      <stop offset="1" stop-color="#bff5ec"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="320" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="#0b0b0a"/>
    <rect width="1200" height="320" fill="url(#dots)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>
    <rect width="8" height="320" fill="#2DD4BF"/>
  </g>

  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="76" font-family="'JetBrains Mono', 'Fira Code', Consolas, Menlo, monospace" font-size="17" fill="#6f6f69">~ $ <tspan fill="#2DD4BF">whoami</tspan></text>
    <text x="64" y="162" font-size="88" font-weight="800" letter-spacing="-2" fill="url(#name)">Kayke</text>
    <text x="64" y="208" font-size="24" fill="#a3a39c">Aprendendo dados, um exercício de cada vez.</text>

    <g font-size="18" font-weight="600" fill="#2DD4BF">
      <rect x="64" y="236" width="104" height="38" rx="19" fill="#2DD4BF" fill-opacity="0.08" stroke="#2DD4BF" stroke-opacity="0.55"/>
      <text x="116" y="261" text-anchor="middle">Python</text>
      <rect x="180" y="236" width="200" height="38" rx="19" fill="#2DD4BF" fill-opacity="0.08" stroke="#2DD4BF" stroke-opacity="0.55"/>
