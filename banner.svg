      <rect x="392" y="236" width="144" height="38" rx="19" fill="#2DD4BF" fill-opacity="0.08" stroke="#2DD4BF" stroke-opacity="0.55"/>
      <text x="464" y="261" text-anchor="middle">Autodidata</text>
    </g>
  </g>

  <rect x="724" y="40" width="416" height="240" rx="16" fill="#121211" stroke="#2a2a27"/>
  <circle cx="750" cy="64" r="5.5" fill="#3a3a37"/>
  <circle cx="770" cy="64" r="5.5" fill="#3a3a37"/>
  <circle cx="790" cy="64" r="5.5" fill="#3a3a37"/>
  <text x="1116" y="69" text-anchor="end" font-family="'JetBrains Mono', 'Fira Code', Consolas, Menlo, monospace" font-size="14" fill="#6f6f69">progresso.py</text>
  <line x1="724" y1="86" x2="1140" y2="86" stroke="#2a2a27"/>

  <g font-family="'JetBrains Mono', 'Fira Code', Consolas, Menlo, monospace" font-size="18">
    <text x="748" y="118"><tspan fill="#2DD4BF">for</tspan><tspan fill="#e6e6e0"> dia </tspan><tspan fill="#2DD4BF">in</tspan><tspan fill="#e6e6e0"> range(365):</tspan></text>
    <text x="748" y="146"><tspan dx="36" fill="#e6e6e0">estudar()</tspan></text>
    <text x="748" y="174"><tspan dx="36" fill="#6f6f69"># um passo de cada vez</tspan></text>
  </g>

  <path d="M748 262 L748 252 C790 248 800 236 838 238 S900 222 930 216 S1000 224 1040 206 S1096 198 1116 190 L1116 262 Z" fill="url(#area)"/>
